name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Typecheck · Test · Coverage
    runs-on: ubuntu-latest

    # The shadow rollback suite runs against a REAL ephemeral Postgres. The
    # workflow provisions three PG services mirroring docker-compose so the live
    # integration + provisioning tests actually run (not self-skip).
    services:
      sentinel-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinel
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      target-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prod
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      shadow-db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5435/sentinel
      TARGET_DB_URL: postgres://postgres:postgres@localhost:5433/prod
      SHADOW_ADMIN_URL: postgres://postgres:postgres@localhost:5434/postgres
      SHADOW_DATABASE_URL: postgres://postgres:postgres@localhost:5434/shadow

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (packages + web)
        run: pnpm typecheck

      - name: Test with coverage (incl. live shadow rollback)
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
