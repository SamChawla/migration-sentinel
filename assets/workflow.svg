<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Migration Sentinel pipeline: Intake, Generate, Dry-run, Pre-flight, Qodo, Gate (human decision), Apply, Audit">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4351"/>
    </marker>
    <style>
      .card   { fill:#0d1117; stroke:#21262d; stroke-width:1.5; }
      .title  { fill:#7d8590; font-size:13px; font-weight:700; letter-spacing:2.5px; }
      .cap    { fill:#6e7681; font-size:12.5px; }
      .conn   { stroke:#30363d; stroke-width:2; stroke-dasharray:5 5; animation:dash 1.2s linear infinite; }
      .nbox   { fill:#161b22; stroke:#30363d; stroke-width:1.6; }
      .nt     { fill:#e6edf3; font-size:14px; font-weight:700; text-anchor:middle; }
      .ns     { fill:#8b949e; font-size:10px; text-anchor:middle; }
      /* staggered highlight wave, synced to the travelling pulse (6s loop) */
      .c1 .nbox, .c2 .nbox, .c3 .nbox, .c4 .nbox, .c5 .nbox, .c7 .nbox, .c8 .nbox { animation:pulse 6s linear infinite; }
      .c1 .nbox { animation-delay:0s }    .c2 .nbox { animation-delay:.857s }
      .c3 .nbox { animation-delay:1.714s } .c4 .nbox { animation-delay:2.571s }
      .c5 .nbox { animation-delay:3.429s } .c7 .nbox { animation-delay:5.143s }
      .c8 .nbox { animation-delay:6s }
      @keyframes pulse { 0%,8%{ stroke:#38bdf8; filter:url(#glow) } 16%,100%{ stroke:#30363d; filter:none } }
      @keyframes dash  { to { stroke-dashoffset:-20 } }
      /* the GATE holds — it always pulses amber (the human pause) */
      .gate .nbox { stroke:#f59e0b; }
      .gate .ring { fill:none; stroke:#f59e0b; stroke-width:2; opacity:0; animation:hold 2.6s ease-in-out infinite; }
      @keyframes hold { 0%,100%{ opacity:0; } 50%{ opacity:.55; } }
    </style>
  </defs>

  <rect class="card" x="8" y="8" width="1024" height="284" rx="16"/>
  <text class="title" x="40" y="46">MIGRATION&#160;SENTINEL &#183; ONE PIPELINE, NO STEP SKIPPED</text>

  <!-- connectors (behind the nodes) -->
  <g fill="none" marker-end="url(#arrow)">
    <line class="conn" x1="134.5" y1="160" x2="153.5" y2="160"/>
    <line class="conn" x1="259.5" y1="160" x2="278.5" y2="160"/>
    <line class="conn" x1="384.5" y1="160" x2="403.5" y2="160"/>
    <line class="conn" x1="509.5" y1="160" x2="528.5" y2="160"/>
    <line class="conn" x1="634.5" y1="160" x2="653.5" y2="160"/>
    <line class="conn" x1="759.5" y1="160" x2="778.5" y2="160"/>
    <line class="conn" x1="884.5" y1="160" x2="903.5" y2="160"/>
  </g>

  <!-- travelling pulse -->
  <circle r="9" fill="#38bdf8" opacity="0.18">
    <animateMotion dur="6s" repeatCount="indefinite" path="M82.5,160 L957.5,160"/>
  </circle>
  <circle r="4" fill="#7dd3fc" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M82.5,160 L957.5,160"/>
  </circle>

  <!-- nodes -->
  <g class="c1"><rect class="nbox" x="30.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="82.5" y="157">Intake</text><text class="ns" x="82.5" y="176">SQL or intent</text></g>
  <g class="c2"><rect class="nbox" x="155.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="207.5" y="157">Generate</text><text class="ns" x="207.5" y="176">TrueForge</text></g>
  <g class="c3"><rect class="nbox" x="280.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="332.5" y="157">Dry-run</text><text class="ns" x="332.5" y="176">shadow clone</text></g>
  <g class="c4"><rect class="nbox" x="405.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="457.5" y="157">Pre-flight</text><text class="ns" x="457.5" y="176">real target</text></g>
  <g class="c5"><rect class="nbox" x="530.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="582.5" y="157">Qodo</text><text class="ns" x="582.5" y="176">SQL review</text></g>

  <!-- GATE (the human pause) -->
  <g class="gate">
    <rect class="ring" x="651.5" y="118" width="112" height="84" rx="15"/>
    <rect class="nbox" x="655.5" y="126" width="104" height="68" rx="12"/>
    <rect x="700" y="140" width="4.5" height="15" rx="1.5" fill="#f59e0b"/>
    <rect x="710" y="140" width="4.5" height="15" rx="1.5" fill="#f59e0b"/>
    <text class="nt" x="707.5" y="172" fill="#f0b429">Gate</text>
    <text class="ns" x="707.5" y="187" fill="#c9922e">human decision</text>
  </g>

  <g class="c7"><rect class="nbox" x="780.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="832.5" y="157">Apply</text><text class="ns" x="832.5" y="176">guarded txn</text></g>
  <g class="c8"><rect class="nbox" x="905.5" y="126" width="104" height="68" rx="12"/><text class="nt" x="957.5" y="157">Audit</text><text class="ns" x="957.5" y="176">append-only</text></g>

  <text class="cap" x="520" y="252" text-anchor="middle">the model proposes &#183; deterministic policy disposes &#183; a blocked migration cannot be pushed through, even with approval</text>
</svg>
